# CGBridge Stage 3: 
language: "Python"
tgt_language: "R"
task: "translation"

output:
  save_dir: "/root/autodl-tmp/first_paper/output/python/third_stage/R_inference_results"
  # 新增：推理结果具体保存的 CSV 路径
  inference_csv: "/root/autodl-tmp/first_paper/python/translation_dataset/R_inference_results_original.csv"
  log_freq: 10
  multilang_evaluation_report: "/root/autodl-tmp/first_paper/human_stage3_llm/qwen_evaluation_reports/mbpp_py_to_r_evaluation.csv"

data:
  # 统一输入路径
  # test_path: "/root/autodl-tmp/first_paper/python/translation_dataset/nl_code_stage3_compiled_clean.jsonl"
  batch_size: 2
  num_workers: 2
  test_path: "/root/autodl-tmp/first_paper/human_stage3_llm/python/r/new_mbpp_python_vs_r.jsonl" #最后的评估用这个数据
  
traindata:
  batch_size: 4
  num_workers: 2

trainer:
  lr: 2e-5              # 💡 将基准学习率从 5e-5 压低到 2e-5（步子迈小点）
  weight_decay: 0.05    # 💡 确保该参数存在，并传递给 AdamW
  num_epochs: 100

finetune:
  lr: 0.000005
  weight_decay: 0.05
  num_epochs: 200
  batch_size: 2
  num_workers: 2
  finetune_model: "/root/autodl-tmp/first_paper/output/python/third_stage/R_inference_results/finetune_best_model.pt"

model:
  embed_dim: 256
  graph_width: 768
  bert_model_dir: "microsoft/graphcodebert-base"
  stage3_model_dir: "/root/autodl-tmp/first_paper/output/python/third_stage/R_inference_results/best_stage3_model.pt"
  stage2_model_dir: "/root/autodl-tmp/first_paper/output/python/second_stage/best_innovative_model.pt"
  llm_name_or_path: "/root/autodl-tmp/first_paper/LLM/qwen"
  # llm_name_or_path: "/root/autodl-tmp/first_paper/LLM/Deepseek"
  # llm_name_or_path: "/root/autodl-tmp/first_paper/LLM/starcoder"
  # llm_name_or_path: "/root/autodl-tmp/first_paper/LLM/llama"
  llm_type: "qwen"
  llm_dtype: "bfloat16"
  max_txt_len: 1024
  num_query_token: 32
  query_groups: [10, 10, 10, 2]

  use_api_mode: False

generation:
  max_new_tokens: 1024  # 保持不变，确保长函数不会被截断
  min_new_tokens: 50
  temperature: 0.9      # 初始生成保持低温度（更稳定）
  top_p: 0.95
  repetition_penalty: 1.05 # 适中的惩罚，防止模型陷入死循环
  use_graph_info: True  # 确保图增强模式开启  False

  # 新增/建议明确的参数
  do_sample: True       # 必须为 True，否则修复时的随机性不足
  num_candidates: 5 #生成的候选

prompts:
  translation:
    # 系统提示词：定义模型角色，并明确图特征（Graph Embedding）的主导地位
    system_prompt: |
      You are an expert R programmer. Translate Python code into syntax-valid, optimized, and idiomatic R code. 
      Strictly prevent Python syntax leakage; all translations must compile flawlessly in native R.

      [1. Syntax Constraints]
      - Strictly block Python leakage: No `elif`, no trailing colons `:`, use `else if (...)` and curly braces `{}`.
      - R is 1-indexed. You MUST convert all 0-based Python loops and list accesses to 1-based R structures (e.g., c(1:length(x))).
      - No Python ternary expressions. Use `as.integer()` for `int()`, and atomic vectors `c(...)` for data vectors.
      - The R function name MUST EXACTLY match the expected testing function name.
      - Always use explicit `return(...)` inside the R function to guarantee the output is passed to assertions.

      [2. OO Translation Rules]
      - R6 Class: Use `library(R6)` and `self$field`. NEVER pass `self` as an explicit function parameter.
      - S4 Class: Use `setClass(..., contains = "list")` and access slots via `@` (e.g., `obj@slot`). NEVER use `self$` or `self@` in S4.
      - Map `__init__` to R6 `initialize` or S4 constructors. Avoid dangling fields or `self$` illusions.

    user_prompt: |
      ### Cross-Modal Representation Analysis
      The multi-dimensional graph features extracted from the Python source code are as follows:
      - **Structural Topology Information (AST)**: {struct_tokens}
      - **Logical Control Flow Information (CFG)**: {logic_tokens}
      - **Code Semantic Context Features**: {semantic_tokens}

      ### Global Generation Guidance
      - **Global Navigation Cognitive Anchor**: {global_tokens}
      
      ### Natural Language Intent
      {nl_description}
      
      ### Python Source Code
      ```python
      {python_code} 
      ```
      
      ### Task
      Please translate the provided Python code into a syntax-valid R implementation based on the analysis above: