language: "Java"
tgt_language: "OCaml"
task: "translation"

output:
  save_dir: "/root/autodl-tmp/first_paper/output/java/third_stage/Ocaml_inference_results"
  # 新增：推理结果具体保存的 CSV 路径
  inference_csv: "/root/autodl-tmp/first_paper/java/translation_dataset/Ocaml_golden/Ocaml_inference_results_original.csv"
  log_freq: 10
  multilang_evaluation_report: "/root/autodl-tmp/first_paper/human_stage3_llm/qwen_evaluation_reports/human_java_to_ocaml_evaluation.csv" #最后评估生成的数据human或mbpp

data:
  # 统一输入路径
  # test_path: "/root/autodl-tmp/first_paper/java/translation_dataset/nl_code_stage3_compiled_clean.jsonl" #第一次推理用这个
  batch_size: 3
  num_workers: 2
  test_path: "/root/autodl-tmp/first_paper/human_stage3_llm/java/ocaml/new_human_java_vs_ocaml.jsonl" #最后的评估用这个数据
  
traindata:
  batch_size: 4
  num_workers: 2

trainer:
  lr: 2e-5              # 💡 将基准学习率从 5e-5 压低到 2e-5（步子迈小点）
  weight_decay: 0.05    # 💡 确保该参数存在，并传递给 AdamW
  num_epochs: 100

finetune:
  lr: 0.00001
  weight_decay: 0.05
  num_epochs: 200
  batch_size: 3
  num_workers: 2
  finetune_model: "/root/autodl-tmp/first_paper/output/java/third_stage/Ocaml_inference_results/finetune_qwen_model.pt"

model:
  embed_dim: 256
  graph_width: 768
  bert_model_dir: "microsoft/graphcodebert-base"
  stage3_model_dir: "/root/autodl-tmp/first_paper/output/java/third_stage/Ocaml_inference_results/best_stage3_model.pt"
  stage2_model_dir: "/root/autodl-tmp/first_paper/output/java/second_stage/best_innovative_model.pt"
  # llm_name_or_path: "/root/autodl-tmp/first_paper/LLM/starcoder"
  # llm_name_or_path: "/root/autodl-tmp/first_paper/LLM/deepseek"
  llm_name_or_path: "/root/autodl-tmp/first_paper/LLM/Qwen"
  llm_type: "qwen"
  llm_dtype: "bfloat16"
  max_txt_len: 1024
  num_query_token: 32
  query_groups: [10, 10, 10, 2]

  use_api_mode: False

generation:
  max_new_tokens: 1024  # 保持不变，确保长函数不会被截断
  min_new_tokens: 50
  temperature: 0.9      # 初始生成保持低温度（更稳定）
  top_p: 0.95
  repetition_penalty: 1.05 # 适中的惩罚，防止模型陷入死循环
  use_graph_info: True  # 确保图增强模式开启  False

  # 新增/建议明确的参数
  do_sample: True       # 必须为 True，否则修复时的随机性不足
  num_candidates: 5 #生成的候选

prompts:
  translation:
    # 系统提示词：面向 OCaml 语言特性进行特化重写
    system_prompt: |
      You are an expert OCaml software engineer specializing in rewriting Java code into highly optimized, idiomatic, and type-safe OCaml code.
      Translation Guidelines:
      1. **Programming Paradigm**: Convert Java's imperative, object-oriented paradigms into idiomatic functional OCaml code using pure functions, pattern matching, and recursion (use tail recursion `rec` where appropriate). Avoid mutable state (`ref`, arrays) unless explicitly required for performance alignment.
      2. **Type Mapping**: Map Java's primitive and container types to OCaml's native types (e.g., int, float, string, bool, List, or Map). Utilize OCaml's powerful algebraic data types (ADTs) and variants to enforce compiler-level correctness.
      3. **Error Handling**: Replace Java's try-catch exceptions with OCaml's idiomatic functional patterns, such as `option` (`Some`/`None`) or `result` (`Ok`/`Error`).
      4. **Module System**: Use OCaml's module system efficiently if structural encapsulation or custom signatures are needed to replicate Java class behaviors.
      
    user_prompt: |
      ### Cross-Modal Representation Analysis
      The multi-dimensional graph features extracted from the Python source code are as follows:
      - **Structural Topology Information (AST)**: {struct_tokens}
      - **Logical Control Flow Information (CFG)**: {logic_tokens}
      - **Code Semantic Context Features**: {semantic_tokens}

      ### Global Generation Guidance
      - **Global Navigation Cognitive Anchor**: {global_tokens}
      
      ### Natural Language Intent
      {nl_description}
      
      ### java Source Code
      ```java
      {java_code} 
      ```
      
      ### Task
      Please translate the provided Java code into a production-ready, syntax-valid OCaml implementation based on the analysis above: