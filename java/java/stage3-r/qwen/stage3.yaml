language: "Java"
tgt_language: "R"
task: "translation"

output:
  save_dir: "/root/autodl-tmp/first_paper/output/java/third_stage/R_inference_results"
  # 新增：推理结果具体保存的 CSV 路径
  inference_csv: "/root/autodl-tmp/first_paper/java/translation_dataset/R_inference_results_original.csv"
  log_freq: 10
  multilang_evaluation_report: "/root/autodl-tmp/first_paper/human_stage3_llm/qwen_evaluation_reports/mbpp_java_to_r_evaluation.csv" #最后评估生成的数据human或mbpp

data:
  # 统一输入路径
  # test_path: "/root/autodl-tmp/first_paper/java/translation_dataset/nl_code_stage3_compiled_clean.jsonl" #第一次推理用这个
  batch_size: 3
  num_workers: 2
  test_path: "/root/autodl-tmp/first_paper/human_stage3_llm/java/r/new_mbpp_java_vs_r.jsonl" #最后的评估用这个数据
  
traindata:
  batch_size: 4
  num_workers: 2

trainer:
  lr: 2e-5              # 💡 将基准学习率从 5e-5 压低到 2e-5（步子迈小点）
  weight_decay: 0.05    # 💡 确保该参数存在，并传递给 AdamW
  num_epochs: 100

finetune:
  lr: 0.00001
  weight_decay: 0.05
  num_epochs: 200
  batch_size: 3
  num_workers: 2
  finetune_model: "/root/autodl-tmp/first_paper/output/java/third_stage/R_inference_results/finetune_qwen_model.pt"

model:
  embed_dim: 256
  graph_width: 768
  bert_model_dir: "microsoft/graphcodebert-base"
  stage3_model_dir: "/root/autodl-tmp/first_paper/output/java/third_stage/R_inference_results/best_stage3_model.pt"
  stage2_model_dir: "/root/autodl-tmp/first_paper/output/java/second_stage/best_innovative_model.pt"
  llm_name_or_path: "/root/autodl-tmp/first_paper/LLM/Qwen"
  # llm_name_or_path: "/root/autodl-tmp/first_paper/LLM/deepseek"
  # llm_name_or_path: "/root/autodl-tmp/first_paper/LLM/starcoder"
  llm_type: "qwen"
  llm_dtype: "bfloat16"
  max_txt_len: 1024
  num_query_token: 32
  query_groups: [10, 10, 10, 2]

  use_api_mode: False

generation:
  max_new_tokens: 1024  # 保持不变，确保长函数不会被截断
  min_new_tokens: 50
  temperature: 0.9      # 初始生成保持低温度（更稳定）
  top_p: 0.95
  repetition_penalty: 1.05 # 适中的惩罚，防止模型陷入死循环
  use_graph_info: True  # 确保图增强模式开启  False

  # 新增/建议明确的参数
  do_sample: True       # 必须为 True，否则修复时的随机性不足
  num_candidates: 5 #生成的候选

prompts:
  translation:
    # 系统提示词：面向 R 语言特性进行特化重写
    system_prompt: |
      You are an expert compiler engineer specializing in Java to R translation. Translate Java code into syntax-valid, optimized, and idiomatic R code. 
      Strictly prevent Java syntax leakage; all translations must compile flawlessly in native R.

      [Strict Rules]
      1. Eliminate all Java syntax remnants (e.g., semicolons `;`, type declarations, `public static`).
      2. Convert Java structures to native R primitives (0-based loops to native 1-based indexing).
      3. CRITICAL: You must wrap the entire implementation inside a plain R function. The R function name MUST be identical to the primary Java method name or the target evaluation task intent. Do not output naked script logic outside a function.
      4. Return ONLY executable R code enclosed inside a single ```R ... ``` block. No explanations, no trailing text.
      
    user_prompt: |
      ### Cross-Modal Representation Analysis
      The following graph-based features have been extracted from the java source code:
      - **Structural Topology (AST)**: {struct_tokens}
      - **Logical Control Flow (CFG)**: {logic_tokens}
      - **Semantic Context**: {semantic_tokens}
      
      ### Global Synthesis Guidance
      - **Global Navigation Anchor**: {global_tokens}
      
      ### Natural Language Intent
      {nl_description}
      
      ### java Source Code
      ```java
      {java_code} 
      ```
      
      ### Task
      Please translate the provided Java code into a production-ready, syntax-valid R implementation based on the analysis above: