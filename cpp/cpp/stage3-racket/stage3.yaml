language: "Cpp"
tgt_language: "Racket"
task: "translation"

output:
  save_dir: "/root/autodl-tmp/first_paper/output/cpp/third_stage/Racket_inference_results"
  # 新增：推理结果具体保存的 CSV 路径
  inference_csv: "/root/autodl-tmp/first_paper/cpp/translation_dataset/Racket_inference_results_original.csv"
  log_freq: 10
  multilang_evaluation_report: "/root/autodl-tmp/first_paper/human_stage3_llm/llama_evaluation_reports/human_cpp_to_racket_evaluation.csv" #最后评估生成的数据human或mbpp

data:
  # 统一输入路径
  # test_path: "/root/autodl-tmp/first_paper/cpp/translation_dataset/nl_code_stage3_cleaned.jsonl" #第一次评估用这个
  batch_size: 1
  num_workers: 2
  test_path: "/root/autodl-tmp/first_paper/human_stage3_llm/cpp/racket/new_human_cpp_vs_racket.jsonl" #最后的评估用这个数据
  
traindata:
  batch_size: 4
  num_workers: 2

trainer:
  lr: 2e-5              # 💡 将基准学习率从 5e-5 压低到 2e-5（步子迈小点）
  weight_decay: 0.05    # 💡 确保该参数存在，并传递给 AdamW
  num_epochs: 100

finetune:
  lr: 0.000005
  weight_decay: 0.05
  num_epochs: 200
  batch_size: 2
  num_workers: 2
  finetune_model: "/root/autodl-tmp/first_paper/output/cpp/third_stage/Racket_inference_results/finetune_llama_model.pt"

model:
  embed_dim: 256
  graph_width: 768
  bert_model_dir: "microsoft/graphcodebert-base"
  stage3_model_dir: "/root/autodl-tmp/first_paper/output/cpp/third_stage/Racket_inference_results/best_stage3_model.pt"
  # stage2_model_dir: "/root/autodl-tmp/first_paper/output/cpp/second_stage/best_innovative_model.pt"
  # llm_name_or_path: "/root/autodl-tmp/first_paper/LLM/starcoder"
  # llm_name_or_path: "/root/autodl-tmp/first_paper/LLM/deepseek"
  # llm_name_or_path: "/root/autodl-tmp/first_paper/LLM/qwen"
  # llm_name_or_path: "/root/autodl-tmp/first_paper/LLM/llamabase"
  llm_name_or_path: "/root/autodl-tmp/first_paper/LLM/llama"
  llm_type: "llama"
  llm_dtype: "bfloat16"
  max_txt_len: 1024
  num_query_token: 32
  query_groups: [10, 10, 10, 2]

  use_api_mode: False

generation:
  max_new_tokens: 1024  # 保持不变，确保长函数不会被截断
  min_new_tokens: 50
  temperature: 0.9      # 初始生成保持低温度（更稳定）
  top_p: 0.95
  repetition_penalty: 1.05 # 适中的惩罚，防止模型陷入死循环
  use_graph_info: False  # 确保图增强模式开启  False

  # 新增/建议明确的参数
  do_sample: True       # 必须为 True，否则修复时的随机性不足
  num_candidates: 5 #生成的候选

prompts:
  translation:
    system_prompt: |
      You are an expert compiler engineer specializing in translating C++ to Racket. 
      Your primary goal is to generate 100% syntactically valid Racket code that compiles perfectly.

      Strict Translation Rules:
      1. **Language Header**: Every Racket script MUST start with `#lang racket` as the very first line.
      2. **Strict Prefix Notation**: NEVER use infix operators like `(* height * t)`. You MUST use prefix notation: `(* height t)`.
      3. **No C++ Object/Dot/Colon Notation**: Do not use `Audio::Master`, `p._x` or `self.p`. Racket does not support dot or colon notation for structures. Use proper struct accessors or closures.
      4. **Struct Field Syntax**: When defining a struct, fields are plain identifiers: `(struct drag-map (factor reflect-negative) #:mutable #:transparent)`.
      5. **BALANCED PARENTHESES**: You must ensure every single opened parenthesis `(` is correctly closed.
      6. **NO TEXT AT END**: Wrap your code strictly inside ```racket and ``` blocks. Do not output any natural language explanations after the code block.
      [Example of Class/Object Translation]:
      If C++ has a class with fields and methods, translate it using standard Racket mutable structs or closures:
      ```racket
      #lang racket
      (struct audio-engine (master general effect music) #:mutable #:transparent)

      (define (create-audio)
        (audio-engine (make-vector 3 0.0) (make-vector 3 0.0) (make-vector 3 0.0) (make-vector 3 0.0)))

      (define (get-gain obj type)
        (vector-ref (case type
                      ['Master (audio-engine-master obj)]
                      ['General (audio-engine-general obj)]
                      [else (audio-engine-music obj)]) 0))
      ```
      
    user_prompt: |
      ### Cross-Modal Representation Analysis
      The following graph-based features have been extracted from the cpp source code:
      - **Structural Topology (AST)**: {struct_tokens}
      - **Logical Control Flow (CFG)**: {logic_tokens}
      - **Semantic Context**: {semantic_tokens}
      
      ### Global Synthesis Guidance
      - **Global Navigation Anchor**: {global_tokens}
      
      ### Natural Language Intent
      {nl_description}
      
      ### cpp Source Code
      ```cpp
      {cpp_code} 
      ```
      
      ### Task
      Please translate the provided C++ code into a production-ready, syntax-valid Racket implementation based on the structural, logical, and semantic features analyzed above: