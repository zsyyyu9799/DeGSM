language: "Cpp"
tgt_language: "OCaml"
task: "translation"

output:
  save_dir: "/root/autodl-tmp/first_paper/output/cpp/third_stage/OCaml_inference_results"
  # 新增：推理结果具体保存的 CSV 路径
  inference_csv: "/root/autodl-tmp/first_paper/cpp/translation_dataset/OCaml_inference_results_original.csv"
  log_freq: 10

data:
  # 统一输入路径
  test_path: "/root/autodl-tmp/first_paper/cpp/translation_dataset/nl_code_stage3_cleaned.jsonl"
  batch_size: 3
  num_workers: 2
  
traindata:
  batch_size: 4
  num_workers: 2

trainer:
  lr: 2e-5              # 💡 将基准学习率从 5e-5 压低到 2e-5（步子迈小点）
  weight_decay: 0.05    # 💡 确保该参数存在，并传递给 AdamW
  num_epochs: 100

model:
  embed_dim: 256
  graph_width: 768
  bert_model_dir: "microsoft/graphcodebert-base"
  stage3_model_dir: "/root/autodl-tmp/first_paper/output/cpp/third_stage/OCaml_inference_results/best_stage3_model.pt"
  stage2_model_dir: "/root/autodl-tmp/first_paper/output/cpp/second_stage/best_innovative_model.pt"
  llm_name_or_path: "/root/autodl-tmp/first_paper/LLM/Qwen2.5"
  llm_type: "qwen"
  llm_dtype: "bfloat16"
  max_txt_len: 1536
  num_query_token: 32
  query_groups: [10, 10, 10, 2]

generation:
  max_new_tokens: 1536  # 保持不变，确保长函数不会被截断
  min_new_tokens: 50
  temperature: 0.8      # 初始生成保持低温度（更稳定）
  top_p: 0.95
  repetition_penalty: 1.05 # 适中的惩罚，防止模型陷入死循环
  use_graph_info: True  # 确保图增强模式开启 False

  # 新增/建议明确的参数
  do_sample: True       # 必须为 True，否则修复时的随机性不足
  num_candidates: 5 #生成的候选

prompts:
  translation:
    # 系统提示词：面向 OCaml 语言特性进行特化重写
    system_prompt: |
      You are an elite compiler engineer. Translate the given C++ (cpp) code into idiomatic, high-performance, and syntax-valid OCaml code.
      Guidelines:
      1. Paradigm Shift: Map loops/mutable states to pure functions, pattern matching, and tail-recursion (`let rec`). Do NOT use `ref`/arrays unless critical.
      2. Type Alignment: Map STL containers (`vector`, `map`) to native OCaml `list`/`Map`. Use ADTs/records for structure layout safety.
      3. Safety: Translate pointers, exceptions, and error returns into OCaml `option` (`Some`/`None`) or `result` (`Ok`/`Error`). Eliminate `nullptr`.
      4. Output Only: Return ONLY executable OCaml code inside ```ocaml ... ``` blocks. No text explanations, macros, or `failwith` placeholders.

      examples:
      - input: |
          struct TreeNode {
              int val;
              TreeNode* left;
              TreeNode* right;
          };
          bool hasPathSum(TreeNode* root, int sum) {
              if (root == nullptr) return false;
              if (root->left == nullptr && root->right == nullptr) {
                  return sum == root->val;
              }
              return hasPathSum(root->left, sum - root->val) || 
                     hasPathSum(root->right, sum - root->val);
          }
        output: |
          ```ocaml
          type tree_node = { val : int; left : tree_node option; right : tree_node option }

          let rec has_path_sum root sum =
            match root with
            | None -> false
            | Some node ->
                match node.left, node.right with
                | None, None -> sum = node.val
                | _ -> has_path_sum node.left (sum - node.val) || 
                       has_path_sum node.right (sum - node.val)
          ```
    user_prompt: |
      ### Cross-Modal Representation Analysis
      The following graph-based features have been extracted from the cpp source code:
      - **Structural Topology (AST)**: {struct_tokens}
      - **Logical Control Flow (CFG)**: {logic_tokens}
      - **Semantic Context**: {semantic_tokens}
      
      ### Global Synthesis Guidance
      - **Global Navigation Anchor**: {global_tokens}
      
      ### Natural Language Intent
      {nl_description}
      
      ### cpp Source Code
      ```cpp
      {cpp_code} 
      ```
      
      ### Task
      Please translate the provided C++ code into a production-ready, syntax-valid OCaml implementation based on the structural, logical, and semantic features analyzed above: